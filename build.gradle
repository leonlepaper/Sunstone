plugins {
	id 'fabric-loom' version '1.17.19'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom сам подключает репозитории Mojang и Fabric.
	// Сюда дописывай свои, если понадобятся сторонние библиотеки.
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	// Подставляет ${version} из gradle.properties внутрь fabric.mod.json
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

// GPL требует отдавать копию лицензии вместе с программой, поэтому кладём
// её внутрь jar. Имя с суффиксом, чтобы не столкнуться с лицензиями
// других модов при распаковке.
jar {
	from("COPYING") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}
